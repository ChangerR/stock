[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlab"
version = "0.1.0"
description = "A股底仓做T（日内回转）研究框架：数据缓存、T+1/涨跌停感知的日内回测引擎、版本化策略与报告"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "baostock==0.9.4",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
tlab = "tlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
